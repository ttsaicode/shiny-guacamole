<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #1d2147 0%, transparent 35%),
        radial-gradient(circle at bottom right, #171a35 0%, transparent 35%),
        #090a14;
      color: #fff;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* ---------------- HEADER ---------------- */

    header {
      width: 100%;
      height: 72px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(9, 10, 20, 0.72);
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      min-width: 0;
    }

    .status {
      font-size: 13px;
      color: #aeb3c7;
      text-align: right;
    }

    .online-count {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.035);
      color: #d8dbea;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.65);
    }

    /* ---------------- MAIN VIDEO AREA ---------------- */

    .video-area {
      width: calc(100% - 64px);
      max-width: 1650px;
      min-height: 560px;
      margin: 28px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .video-card {
      position: relative;
      width: 100%;
      min-height: 560px;
      border-radius: 18px;
      overflow: hidden;
      background: #11131f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    video {
      width: 100%;
      height: 100%;
      min-height: 560px;
      display: block;
      object-fit: cover;
      background: #11131f;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #737991;
      background:
        radial-gradient(circle at center, rgba(68, 74, 116, 0.12), transparent 45%),
        #11131f;
    }

    .placeholder-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      font-size: 24px;
    }

    .placeholder-text {
      font-size: 14px;
      color: #858ba1;
    }

    .video-label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    /* ---------------- CONTROLS ---------------- */

    .controls {
      width: calc(100% - 64px);
      max-width: 1650px;
      margin: 20px auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .primary-btn {
      background: #fff;
      color: #0b0c14;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ---------------- RESPONSIVE ---------------- */

    @media (max-width: 900px) {
      header {
        padding: 0 20px;
      }

      .video-area {
        width: calc(100% - 40px);
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .video-card {
        min-height: 360px;
      }

      video {
        min-height: 360px;
      }

      .controls {
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 600px) {
      header {
        height: 64px;
        padding: 0 16px;
      }

      .logo {
        font-size: 22px;
      }

      .header-right {
        gap: 8px;
      }

      .status {
        display: none;
      }

      .online-count {
        font-size: 11px;
        padding: 6px 8px;
      }

      .video-area {
        width: calc(100% - 24px);
        margin-top: 16px;
        gap: 12px;
      }

      .video-card {
        min-height: 300px;
        border-radius: 14px;
      }

      video {
        min-height: 300px;
      }

      .controls {
        width: calc(100% - 24px);
        margin-top: 14px;
        margin-bottom: 20px;
      }

      button {
        padding: 11px 16px;
      }
    }

    @media (max-width: 380px) {
      .online-count {
        font-size: 10px;
        padding: 5px 7px;
      }

      .video-area {
        width: calc(100% - 16px);
      }

      .controls {
        width: calc(100% - 16px);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Hey.</div>

    <div class="header-right">
      <div id="status" class="status">
        Click Start Camera to begin
      </div>

      <div
        id="onlineCount"
        class="online-count"
        aria-live="polite"
        title="People currently connected to Hey"
      >
        <span class="online-dot"></span>
        <span id="onlineCountText">0 online</span>
      </div>
    </div>
  </header>

  <main>

    <section class="video-area">

      <div class="video-card">
        <video id="localVideo" autoplay muted playsinline></video>

        <div id="localPlaceholder" class="video-placeholder">
          <div class="placeholder-icon">◉</div>
          <div class="placeholder-text">
            Your camera
          </div>
        </div>

        <div class="video-label">
          You
        </div>
      </div>

      <div class="video-card">
        <video id="remoteVideo" autoplay playsinline></video>

        <div id="remotePlaceholder" class="video-placeholder">
          <div class="placeholder-icon">?</div>
          <div class="placeholder-text">
            Waiting for someone...
          </div>
        </div>

        <div class="video-label">
          Stranger
        </div>
      </div>

    </section>

    <section class="controls">

      <button
        id="startCameraBtn"
        class="primary-btn"
      >
        Start Camera
      </button>

      <button
        id="nextBtn"
        class="secondary-btn"
        disabled
      >
        Next
      </button>

    </section>

  </main>

  <script>

    /* ---------------- DOM ---------------- */

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const localPlaceholder =
      document.getElementById("localPlaceholder");

    const remotePlaceholder =
      document.getElementById("remotePlaceholder");

    const startCameraBtn =
      document.getElementById("startCameraBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const statusElement =
      document.getElementById("status");

    const onlineCountElement =
      document.getElementById("onlineCountText");


    /* ---------------- STATE ---------------- */

    let localStream = null;
    let peerConnection = null;
    let socket = null;


    /* ---------------- CONFIG ---------------- */

    const SIGNALING_SERVER =
      `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;


    /* ---------------- UI ---------------- */

    function setStatus(message) {

      if (statusElement) {
        statusElement.textContent = message;
      }

    }


    function updateVideoPlaceholders() {

      if (localVideo.srcObject) {

        localPlaceholder.style.display = "none";

      } else {

        localPlaceholder.style.display = "flex";

      }


      if (remoteVideo.srcObject) {

        remotePlaceholder.style.display = "none";

      } else {

        remotePlaceholder.style.display = "flex";

      }

    }


    /* ---------------- ONLINE COUNT ---------------- */

    function updateOnlineCount(count) {

      if (!onlineCountElement) {
        return;
      }

      const numericCount =
        Number.isFinite(Number(count))
          ? Number(count)
          : 0;

      onlineCountElement.textContent =
        `${numericCount} ${
          numericCount === 1
            ? "person"
            : "people"
        } online`;

    }


    /* ---------------- SIGNALING ---------------- */

    function connectToSignalingServer() {

      if (socket &&
          socket.readyState === WebSocket.OPEN) {

        return;

      }


      socket =
        new WebSocket(SIGNALING_SERVER);


      socket.addEventListener(
        "open",
        () => {

          setStatus(
            "Connected. Click Start Camera to begin"
          );

        }
      );


      socket.addEventListener(
        "message",
        async event => {

          let message;

          try {

            message =
              JSON.parse(event.data);

          } catch {

            return;

          }


          if (message.type === "online-count") {

            updateOnlineCount(
              message.count
            );

            return;

          }


          /*
            Existing signaling logic can handle
            offer / answer / candidate messages here.
          */

        }
      );


      socket.addEventListener(
        "close",
        () => {

          if (!localStream) {

            setStatus(
              "Disconnected from server"
            );

          }

        }
      );


      socket.addEventListener(
        "error",
        () => {

          if (!localStream) {

            setStatus(
              "Unable to connect to server"
            );

          }

        }
      );

    }


    /* ---------------- CAMERA ---------------- */

    async function startCamera() {

      try {

        localStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });


        localVideo.srcObject =
          localStream;


        startCameraBtn.disabled = true;

        nextBtn.disabled = false;


        updateVideoPlaceholders();


        setStatus(
          "Camera started. Looking for someone..."
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "Camera and microphone permission is required"
        );

      }

    }


    /* ---------------- NEXT ---------------- */

    function nextPerson() {

      if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

      }


      remoteVideo.srcObject = null;

      updateVideoPlaceholders();


      setStatus(
        "Looking for someone new..."
      );


      /*
        Existing matchmaking logic should
        request the next stranger here.
      */

    }


    /* ---------------- EVENTS ---------------- */

    startCameraBtn.addEventListener(
      "click",
      startCamera
    );


    nextBtn.addEventListener(
      "click",
      nextPerson
    );


    /* ---------------- INITIAL STATE ---------------- */

    updateVideoPlaceholders();

    setStatus(
      "Click Start Camera to begin"
    );


    /*
      Connect to the signaling server immediately.

      This does NOT request camera or microphone permission.
      It only keeps the realtime online counter updated for
      everyone who has the page open.
    */

    connectToSignalingServer();

  </script>

</body>
</html>
