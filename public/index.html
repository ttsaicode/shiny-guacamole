<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WebRTC Video Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 20px 10px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .videos {
      width: 100%;
      max-width: 1200px;

      margin: 20px auto;

      padding: 20px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 20px;
    }

    .video-container {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #222;

      border-radius: 12px;

      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      background: #222;
    }

    .label {
      position: absolute;

      top: 10px;
      left: 10px;

      padding: 6px 10px;

      background:
        rgba(0, 0, 0, 0.65);

      border-radius: 6px;

      font-size: 14px;
    }

    .controls {
      text-align: center;

      padding: 10px 20px 20px;
    }

    button {
      padding: 12px 20px;

      margin: 5px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-size: 16px;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    #startButton {
      background: white;
      color: #111;
    }

    #status {
      text-align: center;

      padding: 10px 20px 30px;

      color: #aaa;

      min-height: 40px;
    }

    @media (max-width: 700px) {
      .videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>WebRTC Video Test</h1>

    <p>
      Open this page in two browser tabs.
    </p>

  </header>


  <main>

    <div class="videos">

      <!-- YOUR VIDEO -->

      <div class="video-container">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="label">
          You
        </div>

      </div>


      <!-- OTHER PERSON -->

      <div class="video-container">

        <video
          id="remoteVideo"
          autoplay
          playsinline
        ></video>

        <div class="label">
          Other person
        </div>

      </div>

    </div>


    <div class="controls">

      <button id="startButton">
        Start Camera
      </button>

    </div>


    <div id="status">
      Connecting to signaling server...
    </div>

  </main>


  <script src="/app.js"></script>

</body>

</html>
